[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatbot-distributed-platform"
version = "1.0.0"
description = "Distributed Real-Time Communication Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.20.0",
    "redis>=5.0.3",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.2",
    "pyotp>=2.9.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "aiofiles>=23.2.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.1"
]
[project.optional-dependencies]
dev = ["pytest>=8.1.0", "pytest-asyncio>=0.23.5", "pytest-cov>=4.1.0", "httpx>=0.27.0"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
